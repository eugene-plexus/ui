name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact
  lint-typecheck-build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  wheel:
    name: Build the eugene-plexus-ui wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      # The browser half of an install is a Python distribution: the
      # static export staged into `python/eugene_plexus_ui/static/` and
      # wrapped by hatchling. The agent finds it through
      # `importlib.resources`, so a wheel that builds but contains no
      # index.html is installable, importable, and useless in a way only
      # a browser would notice -- which is what the assertions below are
      # for. Nothing is published here; publishing belongs to the
      # release, which follows the install work.
      - name: Build the export and stage it
        run: npm run build:python

      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Assert the wheel actually carries a UI
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/eugene_plexus_ui-*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "eugene_plexus_ui/static/index.html" in names, "no index.html in the wheel"
          assert any(n.startswith("eugene_plexus_ui/static/_next/") for n in names), "no bundles"
          print(f"{wheel}: {len(names)} files")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: eugene-plexus-ui-wheel
          path: dist/*.whl

  codegen-freshness:
    name: Codegen freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Regenerate from pinned specs
        run: npm run codegen

      - name: Assert no diff
        shell: bash
        run: |
          if ! git diff --exit-code src/generated/; then
            echo "::error::Generated TypeScript is out of sync with SPECS_REF."
            echo "Run 'npm run codegen' locally and commit the result."
            exit 1
          fi

  dco:
    name: DCO sign-off check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check Signed-off-by lines on every PR commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR:-}" == "dependabot[bot]" ]]; then
            echo "Dependabot commits are exempt from DCO sign-off."
            exit 0
          fi
          status=0
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            name=$(git log -1 --format=%an "$sha")
            email=$(git log -1 --format=%ae "$sha")
            expected="Signed-off-by: ${name} <${email}>"
            msg=$(git log -1 --format=%B "$sha")
            if ! grep -Fxq "$expected" <<<"$msg"; then
              echo "::error::Commit $sha by ${name} <${email}> is missing a matching DCO sign-off."
              echo "  Expected line: ${expected}"
              echo "  Fix with: git commit --amend -s --no-edit  (or: git rebase --signoff main)"
              status=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          exit $status
