# The browser half of an Eugene Plexus install, as a Python wheel.
#
# The UI is a Next.js static export — a client-side React application in
# plain files. This package is the vehicle that gets those files into
# the same virtualenv the agent runs from, so `pip install
# eugene-plexus-ui` is the whole of "add a browser" and Node disappears
# from the runtime on every platform.
#
# Precedent: Open WebUI ships its built frontend inside its Python
# wheel. Known-good pattern, not an invention here.
#
# Build:  npm ci && npm run build:python && python -m build --wheel
# The static files are produced by `next build`, are NOT in git, and are
# pulled into the wheel by [tool.hatch.build] artifacts below.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eugene-plexus-ui"
version = "0.1.0"
description = "Web UI for Eugene Plexus, as static assets served by the node agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Eugene Plexus contributors" }]
keywords = ["eugene-plexus", "ui", "static", "nextjs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/eugene-plexus"
Repository = "https://github.com/eugene-plexus/ui"
Specs = "https://github.com/eugene-plexus/specs"

[tool.hatch.build.targets.wheel]
packages = ["python/eugene_plexus_ui"]

# The point of the whole file. `python/eugene_plexus_ui/static/` is
# build output and is gitignored, so hatchling's VCS-aware file
# selection would leave it out and produce a wheel containing a module
# that reports an empty directory — installable, importable, and useless
# in a way only a browser would notice.
[tool.hatch.build]
artifacts = ["python/eugene_plexus_ui/static/**"]
